name: Deploy Backend to cPanel

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/backend-tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy Core Files (kuba_backend)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || '1624' }}
        run: |
          # Tar backend excluding public, vendor, storage, cache, and .env, then extract on remote
          tar czf - -C ./backend --exclude='public' --exclude='vendor' --exclude='storage' --exclude='bootstrap/cache' --exclude='.env' . \
            | ssh -p $CPANEL_PORT -o StrictHostKeyChecking=no $CPANEL_USER@$CPANEL_HOST \
              "cd /home/$CPANEL_USER/kuba_backend && tar xzf -"

      - name: Deploy Public Files (public_html/api)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || '1624' }}
        run: |
          # Sync the public directory to public_html/api
          tar czf - -C ./backend/public . \
            | ssh -p $CPANEL_PORT -o StrictHostKeyChecking=no $CPANEL_USER@$CPANEL_HOST \
              "rm -rf /home/$CPANEL_USER/public_html/api/* && cd /home/$CPANEL_USER/public_html/api && tar xzf -"

      - name: Post-deployment Setup (Composer, Migrations, Artisan)
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT || '1624' }}
        run: |
          ssh -p $CPANEL_PORT -o StrictHostKeyChecking=no $CPANEL_USER@$CPANEL_HOST << EOF
            set -e
            cd /home/$CPANEL_USER/kuba_backend

            echo "Installing Composer dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            echo "Setting up directory permissions..."
            chmod -R 775 storage bootstrap/cache

            echo "Checking and repairing storage symlink..."
            if [ ! -L /home/$CPANEL_USER/public_html/api/storage ]; then
              echo "Symlink missing. Creating it..."
              ln -s /home/$CPANEL_USER/kuba_backend/storage/app/public /home/$CPANEL_USER/public_html/api/storage
            fi

            echo "Running Artisan commands..."
            touch database/database.sqlite
            php artisan down || true
            php artisan optimize:clear
            php artisan migrate --force
            php artisan config:cache
            php artisan event:cache
            php artisan route:cache
            php artisan view:cache
            php artisan up || true
          EOF
