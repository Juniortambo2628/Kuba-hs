name: Frontend Consistency Tests

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Start Dev Server
        run: npm run dev &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

      - name: Wait for Dev Server
        run: npx wait-on http://localhost:3000 --timeout 120000

      - name: Generate Linux VRT Baselines
        run: npx playwright test --project=desktop-chrome --update-snapshots

      - name: Commit Updated Baselines
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/*-snapshots/
          git diff --cached --quiet || git commit -m "chore: update VRT baselines for Linux [skip ci]" && git push

      - name: Run Visual Regression Tests
        run: npx playwright test --project=desktop-chrome

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/tests/visual/results/
          retention-days: 14

      - name: Upload Snapshots Diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshot-diffs
          path: frontend/tests/visual/**/*.png
          retention-days: 14

  design-token-audit:
    name: Design Token Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Design Token Audit
        run: npm run test:tokens

  stylelint:
    name: Style Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Stylelint
        run: npm run lint:styles

  accessibility:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Start Dev Server
        run: npm run dev &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

      - name: Wait for Dev Server
        run: npx wait-on http://localhost:3000 --timeout 120000

      - name: Run Accessibility Tests
        run: npx playwright test tests/visual/accessibility.spec.ts --reporter=list

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-results
          path: frontend/tests/visual/results/
          retention-days: 14

  e2e:
    name: E2E Functional Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Start Dev Server
        run: npm run dev &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

      - name: Wait for Dev Server
        run: npx wait-on http://localhost:3000 --timeout 120000

      - name: Run E2E Tests
        run: npx playwright test tests/visual/e2e.spec.ts --reporter=list

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: frontend/tests/visual/results/
          retention-days: 14
